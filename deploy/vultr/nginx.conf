# JRVC-only nginx main configuration for a Debian/Ubuntu-style VULTR host.
# Install as /etc/nginx/nginx.conf only after backing up the original and
# confirming the worker user and module include path on the server.

user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    types_hash_max_size 2048;
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    access_log /var/log/nginx/access.log combined;

    # Modern TLS only. Certificate/key paths are specified per vhost.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        image/svg+xml;

    # This is the only vhost include. Move/disable VULTR's old http.conf and
    # https.conf if they are also included elsewhere and define server blocks.
    include /etc/nginx/conf.d/*.conf;
}
