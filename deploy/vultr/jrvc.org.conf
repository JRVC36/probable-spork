# JRVC-only VULTR vhost. Install as /etc/nginx/conf.d/jrvc.org.conf.
# Requires the existing Certbot certificate to cover both jrvc.org and
# www.jrvc.org. Static site root is the published tree, never the git clone.

# HTTP-01 challenge remains available; all other HTTP traffic goes to canonical HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name jrvc.org www.jrvc.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.jrvc.org$request_uri;
    }
}

# Reject unknown TLS hostnames rather than serving the JRVC site by default.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/jrvc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jrvc.org/privkey.pem;

    return 444;
}

# Canonicalize the apex domain while retaining a valid certificate for TLS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jrvc.org;

    ssl_certificate     /etc/letsencrypt/live/jrvc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jrvc.org/privkey.pem;

    return 301 https://www.jrvc.org$request_uri;
}

# Canonical JRVC website.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.jrvc.org;

    ssl_certificate     /etc/letsencrypt/live/jrvc.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jrvc.org/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # This include provides security headers, CSP, cache rules, redirects,
    # privacy guards, and the custom 404. Its /assets/ location uses ^~ to
    # override generic extension-based cache locations from old VULTR configs.
    include /etc/nginx/snippets/jrvc-site.inc;

    # Static-only site: no PHP/FastCGI handler. Resolve existing files only.
    location / {
        try_files $uri $uri/ =404;
    }
}
