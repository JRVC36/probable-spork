# Johns River Valley Camp — nginx vhost
#
#   /etc/nginx/sites-available/jrvc.org  ->  symlink into sites-enabled/
#
# `root` is the PUBLISHED WEB ROOT, never the git clone.
# deploy/publish.sh builds the clone and exports a clean tree there, so
# .git/, src/, build.mjs and the docs are never servable.

# Serve over plain HTTP first. Redirecting to 443 before Certbot has issued
# certificates would make the site unreachable AND break the ACME challenge.
# After Certbot runs it will add its own :443 block and the redirect for you.
server {
    listen 80;
    listen [::]:80;
    server_name jrvc.org www.jrvc.org;

    root /var/www/jrvc.org;
    index index.html;

    # Certbot HTTP-01 challenge must remain reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/snippets/jrvc-site.inc;
}

# ---------------------------------------------------------------------------
# After Certbot has issued certificates it will create a :443 server block
# itself. If you prefer to manage TLS manually, copy the commented block from
# deploy/nginx.conf in the repository, uncomment it, and add:
#
#   location / { return 301 https://www.jrvc.org$request_uri; }
#
# inside the :80 block above.
# ---------------------------------------------------------------------------
