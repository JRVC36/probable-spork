# Johns River Valley Camp — nginx server block
#
# /etc/nginx/sites-available/jrvc.org   →  symlink into sites-enabled
#
# IMPORTANT: `root` is the PUBLISHED WEB ROOT, never the git clone.
# deploy/publish.sh builds the clone and exports a clean tree here, so
# .git/, src/, build.mjs and the markdown docs are never servable.

server {
    listen 80;
    listen [::]:80;
    server_name jrvc.org www.jrvc.org;

    # Redirect to HTTPS once certbot has issued a certificate.
    # Leave this block active until then.
    return 301 https://www.jrvc.org$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.jrvc.org;

    # ssl_certificate     /etc/letsencrypt/live/jrvc.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jrvc.org/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/jrvc.org;
    index index.html;

    charset utf-8;
    server_tokens off;

    # ---------------------------------------------------------------- compression
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript
               application/json image/svg+xml application/manifest+json;

    # Pre-compressed woff2 is already compressed — do not gzip it again.
    gzip_bypass application/font-woff2;

    # ---------------------------------------------------------------- caching
    # Hashed/immutable media can be cached hard: images never change in place,
    # and CSS/JS are requested with a ?v=<content-hash> query the build emits.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML must always revalidate, or visitors will see stale prices.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files $uri =404;
    }

    location = / {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        try_files /index.html =404;
    }

    # ---------------------------------------------------------------- privacy guards
    # Defence in depth: even if something is mis-exported, never serve dotfiles
    # or the source tree.
    location ~ /\.            { deny all; return 404; }
    location ~ ^/(src|site|deploy)/ { deny all; return 404; }
    location ~* \.(mjs|md|toml|sh)$  { deny all; return 404; }

    # ---------------------------------------------------------------- errors
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store";
    }

    # ---------------------------------------------------------------- security headers
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "SAMEORIGIN" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;
    # Self-hosted fonts and images only; no third-party scripts are loaded.
    add_header Content-Security-Policy  "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'self'; base-uri 'self'" always;

    # ---------------------------------------------------------------- redirects
    # Legacy Wix URLs → new pages. Keeps search rankings and old links alive.
    location = /summer-camps          { return 301 /summer-camp.html; }
    location = /day-camp              { return 301 /summer-camp.html; }
    location = /lodging               { return 301 /facilities.html; }
    location = /meeting-spaces        { return 301 /facilities.html; }
    location = /retreats-and-special-events { return 301 /retreats.html; }
    location = /mission-camps         { return 301 /mission-trips.html; }
    location = /service-trips         { return 301 /mission-trips.html; }
    location = /faqs                  { return 301 /faq.html; }
    location = /about-us              { return 301 /about.html; }
    location = /directors-statement   { return 301 /about.html; }
    location = /contact-us            { return 301 /visit.html; }
    location = /give                  { return 301 /get-involved.html; }
    location = /volunteeroportunities { return 301 /get-involved.html#volunteer; }
    location = /citapplication        { return 301 /summer-camp.html; }
    location = /book-online           { return 301 /register.html; }
    location = /90thanniversary       { return 301 /about.html; }
    location = /shop-1                { return 301 /get-involved.html; }
    location = /kitchen-planner       { return 301 /get-involved.html; }

    # ---------------------------------------------------------------- logging
    access_log /var/log/nginx/jrvc.org.access.log;
    error_log  /var/log/nginx/jrvc.org.error.log warn;
}

# Canonicalise the apex domain onto www.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jrvc.org;

    # ssl_certificate     /etc/letsencrypt/live/jrvc.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/jrvc.org/privkey.pem;

    return 301 https://www.jrvc.org$request_uri;
}
